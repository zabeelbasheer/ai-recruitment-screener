services:
  - type: web
    name: zeta-recruitment-screener
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MODEL_NAME
        value: llama-3.3-70b-versatile
      - key: SESSION_SECRET_KEY
        sync: false
      - key: RECRUITER_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false